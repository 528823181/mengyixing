<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 虚拟展厅 | 蒙益行 · 智游内蒙古</title>
<meta name="description" content="蒙益行 3D 虚拟展厅：十二座城围成一圈，拖动旋转，点开对应城市看它的文物。">
<link rel="icon" href="assets/img/mengyixing-avatar.png">
<link rel="stylesheet" href="css/pangu.css">
<style>
  html { scroll-behavior: smooth; }
  body.hall-body { margin: 0; background: #07110b; color: var(--cream); overflow-y: auto; overflow-x: hidden; }
  .hall-top {
    height: 64px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 0 24px; border-bottom: 1px solid rgba(245,240,230,.1);
    background: rgba(7,17,11,.94); position: sticky; top: 0; z-index: 20; backdrop-filter: blur(8px);
  }
  .hall-brand { display: flex; align-items: center; gap: 10px; color: var(--cream); }
  .hall-brand img { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(227,201,143,.4); }
  .hall-brand b { display: block; font-family: var(--serif); font-size: 15px; letter-spacing: .08em; }
  .hall-brand small { display: block; color: var(--gold-2); font-size: 7px; letter-spacing: .18em; }
  .hall-top-title { color: rgba(245,240,230,.5); font-size: 10px; letter-spacing: .18em; }
  .hall-back { justify-self: end; color: rgba(245,240,230,.65); font-size: 10px; letter-spacing: .08em; }
  .hall-back:hover { color: var(--gold-2); }
  .hall-hero { text-align: center; padding: 30px 20px 0; }
  .hall-hero .eyebrow { color: var(--gold-2); }
  .hall-hero h1 { margin: 8px 0 4px; font-family: var(--serif); font-size: clamp(34px, 4.6vw, 62px); font-weight: 500; line-height: 1.08; letter-spacing: -.03em; }
  .hall-hero h1 em { color: var(--gold-2); font-family: var(--latin); font-style: italic; }
  .hall-hero p { color: rgba(245,240,230,.48); font-size: 11px; letter-spacing: .04em; }
  .hall-ring-wrap { position: relative; height: min(540px, 72vh); min-height: 440px; }
  .ring-stage { position: absolute; inset: 0; perspective: 1700px; overflow: hidden; }
  .ring-stage::before {
    content: ''; position: absolute; left: 50%; top: 56%; width: min(62vw, 780px); height: 150px;
    transform: translate(-50%,-50%); border-radius: 50%;
    background: radial-gradient(ellipse, rgba(201,161,94,.14), transparent 70%);
    filter: blur(16px); pointer-events: none;
  }
  .ring { position: absolute; left: 50%; top: 36%; width: 0; height: 0; transform-style: preserve-3d; transition: transform .55s var(--ease); }
  .ring.is-dragging { transition: none; }
  .ring-card {
    position: absolute; left: 50%; top: 50%; width: 258px; height: 356px;
    margin: -178px 0 0 -129px; padding: 0; border: 1px solid rgba(245,240,230,.18);
    background: #0c1a12; color: var(--cream); overflow: hidden; cursor: pointer;
    transform-style: preserve-3d; backface-visibility: hidden;
    transition: opacity .4s, border-color .4s, box-shadow .4s, filter .4s;
    box-shadow: 0 20px 50px -30px rgba(0,0,0,.8);
  }
  .ring-card img { display: block; width: 100%; height: 100%; object-fit: cover; filter: saturate(.72) brightness(.58); transition: filter .4s, transform .55s; }
  .ring-card::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(7,17,11,.05) 20%, rgba(7,17,11,.35) 52%, rgba(7,17,11,.92) 100%);
  }
  .ring-card:hover img { filter: saturate(.95) brightness(.78); transform: scale(1.03); }
  .ring-card.is-active { border-color: rgba(227,201,143,.75); box-shadow: 0 30px 70px -26px rgba(0,0,0,.9), 0 0 0 1px rgba(201,161,94,.2); }
  .ring-card.is-active img { filter: saturate(.95) brightness(.78); }
  .ring-card.is-far { opacity: 0 !important; pointer-events: none; }
  .ring-card-body { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 18px 18px 16px; text-align: left; }
  .ring-card-body .tag { color: var(--gold-2); font-size: 7px; letter-spacing: .18em; }
  .ring-card-body h2 { margin: 5px 0 2px; font-family: var(--serif); font-size: 23px; font-weight: 500; }
  .ring-card-body small { display: block; color: rgba(245,240,230,.55); font-size: 8px; line-height: 1.5; }
  .ring-ui {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 8;
    display: flex; align-items: center; gap: 14px; padding: 7px 12px;
    border: 1px solid rgba(245,240,230,.12); background: rgba(7,17,11,.6); backdrop-filter: blur(4px);
  }
  .ring-ui button { width: 28px; height: 26px; border: 1px solid rgba(245,240,230,.2); background: transparent; color: rgba(245,240,230,.7); font-size: 12px; cursor: pointer; }
  .ring-ui button:hover { border-color: var(--gold); color: var(--gold-2); }
  .ring-ui span { color: rgba(245,240,230,.42); font-size: 9px; letter-spacing: .05em; white-space: nowrap; }
  .ring-ui .ring-index { color: var(--gold-2); font-family: var(--latin); font-size: 10px; letter-spacing: .1em; }
  .hall-footer { width: min(1180px,92vw); margin: 0 auto; padding: 0 0 34px; display: flex; justify-content: space-between; color: rgba(245,240,230,.25); font-size: 8px; letter-spacing: .06em; }

  /* model overlay */
  body.is-locked { overflow: hidden; }
  .relic-modal { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 0; visibility: hidden; }
  .relic-modal.is-open { opacity: 1; visibility: visible; }
  .relic-modal-bg { position: absolute; inset: 0; background: rgba(3,8,5,.9); backdrop-filter: blur(5px); }
  .relic-dialog { position: relative; z-index: 2; width: min(1100px, 95vw); height: min(700px, 88vh); display: grid; grid-template-columns: minmax(0,1fr) 320px; background: #0a1710; border: 1px solid rgba(245,240,230,.16); box-shadow: 0 50px 120px -40px #000; }
  .relic-model { position: relative; min-width: 0; background: radial-gradient(circle at 50% 45%, #173326, #07110b 70%); overflow: hidden; }
  .relic-model::after { content: ''; position: absolute; left: 50%; bottom: 9%; width: 45%; height: 30px; transform: translateX(-50%); background: radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%); filter: blur(8px); pointer-events: none; }
  #relicViewer { position: relative; z-index: 2; width: 100%; height: 100%; background: transparent; --poster-color: transparent; --progress-bar-color: transparent; }
  #relicViewer::part(default-progress-bar) { display: none; }
  .relic-status { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 3; color: var(--gold-2); font-size: 11px; letter-spacing: .08em; background: rgba(7,17,11,.8); border: 1px solid rgba(201,161,94,.25); padding: 9px 14px; }
  .relic-close { position: absolute; top: 12px; left: 12px; z-index: 5; width: 34px; height: 34px; border: 1px solid rgba(245,240,230,.25); background: rgba(7,17,11,.7); color: var(--cream); font-size: 20px; line-height: 1; cursor: pointer; }
  .relic-close:hover { border-color: var(--gold); color: var(--gold-2); }
  .relic-side { padding: 26px 22px 20px; overflow-y: auto; border-left: 1px solid rgba(245,240,230,.1); display: flex; flex-direction: column; }
  .relic-side .tag { color: var(--gold-2); font-size: 8px; letter-spacing: .2em; }
  .relic-side h2 { margin: 9px 0 3px; font-family: var(--serif); font-size: clamp(23px,2.3vw,32px); font-weight: 500; line-height: 1.25; }
  .relic-side .en { color: rgba(245,240,230,.32); font-size: 8px; letter-spacing: .16em; }
  .relic-side .desc { margin-top: 16px; color: rgba(245,240,230,.68); font-size: 12px; line-height: 1.95; }
  .relic-facts { margin-top: 12px; padding: 10px 12px; border: 1px solid rgba(245,240,230,.1); background: rgba(245,240,230,.025); display: flex; flex-direction: column; gap: 6px; }
  .relic-facts div { display: flex; gap: 10px; align-items: baseline; }
  .relic-facts span { flex: 0 0 34px; color: var(--gold); font-size: 8px; letter-spacing: .1em; }
  .relic-facts b { color: rgba(245,240,230,.66); font-size: 9.5px; font-weight: 400; line-height: 1.6; }
  .relic-side .detail { margin-top: 12px; color: rgba(245,240,230,.55); font-size: 10.5px; line-height: 1.95; }
  .relic-meta { margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(245,240,230,.1); }
  .relic-meta span { display: block; color: var(--gold); font-size: 8px; letter-spacing: .16em; }
  .relic-meta p { margin-top: 4px; color: rgba(245,240,230,.45); font-size: 10px; line-height: 1.8; }
  .relic-side .btn { margin-top: 18px; width: 100%; justify-content: center; min-height: 40px; font-size: 10px; }
  .relic-nav { display: flex; gap: 8px; margin-top: 14px; }
  .relic-nav button { flex: 1; height: 34px; border: 1px solid rgba(245,240,230,.2); background: transparent; color: rgba(245,240,230,.65); font-size: 9px; cursor: pointer; }
  .relic-nav button:hover { border-color: var(--gold); color: var(--gold-2); }
  .relic-counter-line { margin-top: auto; padding-top: 16px; color: rgba(245,240,230,.25); font-family: var(--latin); font-size: 10px; letter-spacing: .14em; }
  .relic-side .note { margin-top: 10px; color: rgba(245,240,230,.28); font-size: 8px; line-height: 1.7; }
  @media (max-width: 900px) {
    .hall-top { height: 58px; padding: 0 14px; grid-template-columns: 1fr auto; }
    .hall-top-title { display: none; }
    .hall-hero { padding-top: 22px; }
    .hall-hero h1 { font-size: clamp(30px, 8vw, 46px); }
    .hall-ring-wrap { height: 430px; min-height: 380px; }
    .ring-card { width: 190px; height: 270px; margin: -135px 0 0 -95px; }
    .ring-card-body { padding: 11px 12px 10px; }
    .ring-card-body h2 { font-size: 18px; }
    .relic-modal { padding: 0; align-items: flex-end; }
    .relic-dialog { width: 100%; height: 94vh; grid-template-columns: 1fr; grid-template-rows: minmax(0, 58%) minmax(0, 42%); }
    .relic-side { border-left: 0; border-top: 1px solid rgba(245,240,230,.1); padding: 18px; }
    .relic-model { min-height: 0; }
  }
</style>
</head>
<body class="hall-body" data-page="hall">
  <header class="hall-top">
    <a class="hall-brand" href="index.html">
      <img src="assets/img/mengyixing-avatar.png" alt="蒙益行">
      <span><b>蒙益行</b><small>MENGYIXING · 3D GALLERY</small></span>
    </a>
    <span class="hall-top-title">北疆文物 · 3D 展厅</span>
    <a class="hall-back" href="index.html">← 返回首页</a>
  </header>

  <main>
    <section class="hall-hero">
      <span class="eyebrow">MENGYIXING · 3D GALLERY</span>
      <h1>走进北疆的<br><em>虚拟展厅</em></h1>
      <p>十二座城围成一圈，拖动旋转，点开对应城市看它的文物。</p>
    </section>

    <section class="hall-ring-wrap">
      <div class="ring-stage" id="ringStage"><div class="ring" id="ring"></div></div>
      <div class="ring-ui">
        <button type="button" id="ringPrev" aria-label="上一座城">←</button>
        <span class="ring-index" id="ringIndex">01 / 12</span>
        <span>拖动旋转 · 点卡片看文物</span>
        <button type="button" id="ringNext" aria-label="下一座城">→</button>
      </div>
    </section>
  </main>

  <footer class="hall-footer"><span>十二城 · 十二件文物</span><span>模型来自本地 3D 扫描文件，保留原始贴图</span></footer>

  <div class="relic-modal" id="relicModal" aria-hidden="true">
    <div class="relic-modal-bg" data-relic-close></div>
    <div class="relic-dialog" role="dialog" aria-modal="true" aria-labelledby="relicTitle">
      <div class="relic-model">
        <model-viewer id="relicViewer"
          camera-controls
          auto-rotate
          auto-rotate-delay="1200"
          rotation-per-second="8deg"
          interaction-prompt="none"
          shadow-intensity="0.8"
          shadow-softness="0.8"
          exposure="1.1"
          camera-orbit="0deg 75deg 140%"
          min-camera-orbit="auto 0deg auto"
          max-camera-orbit="auto 180deg auto"
          field-of-view="30deg"
          touch-action="none"
          alt="城市文物 3D 模型"></model-viewer>
        <div class="relic-status" id="relicStatus" hidden>模型加载中…</div>
        <button class="relic-close" type="button" data-relic-close aria-label="关闭">×</button>
      </div>
      <aside class="relic-side">
        <span class="tag" id="relicTag">城市 · 呼和浩特</span>
        <h2 id="relicTitle">嵌贝鹿形青铜镇</h2>
        <span class="en" id="relicEn">HOHHOT</span>
        <p class="desc" id="relicDesc"></p>
        <div class="relic-facts" id="relicFacts"></div>
        <div class="relic-meta"><span>文物档案</span><p id="relicMeta"></p></div>
        <p class="detail" id="relicDetail"></p>
        <a class="btn" id="relicLink" href="cities/hohhot.html">进入呼和浩特页 →</a>
        <div class="relic-nav"><button type="button" id="relicPrev">← 上一件</button><button type="button" id="relicNext">下一件 →</button></div>
        <span class="relic-counter-line" id="relicCounter">01 / 12</span>
        <p class="note">模型来自你提供的 3D 扫描文件，已保留原始贴图与 UV；拖动旋转、滚轮缩放。</p>
      </aside>
    </div>
  </div>

  <script src="js/model-viewer-umd.min.js"></script>
  <script src="js/relic-detail.js"></script>
  <script src="js/hall-ring.js"></script>
</body>
</html>
